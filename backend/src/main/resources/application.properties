
spring.application.name=portfolio-backend

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${PORT:8080}

# Resend email API
resend.api.key=${RESEND_API_KEY}
portfolio.sender.email=${PORTFOLIO_SENDER_EMAIL:onboarding@resend.dev}
portfolio.owner.email=${PORTFOLIO_OWNER_EMAIL}
